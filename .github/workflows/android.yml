name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag build half-way through a release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        # `yes` dies of SIGPIPE once sdkmanager exits; keep that from failing the pipefail shell.
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache provider; the default one is a commercial preview for private repos.
          cache-provider: basic

      - name: Unit tests and debug APK
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: monolauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            msg="KEYSTORE_BASE64 secret이 없어 릴리스를 건너뜁니다. scripts/make-keystore.sh로 키스토어를 만들고 Settings > Secrets and variables > Actions에 KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD를 추가한 뒤 태그를 다시 푸시하세요."
            echo "::error title=서명 키 없음::$msg"
            echo "### 릴리스 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=서명 설정 불완전::KEYSTORE_BASE64는 있지만 다음 secret이 없습니다:$missing"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - if: steps.signing.outputs.present == 'true'
        uses: actions/checkout@v7

      - if: steps.signing.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        if: steps.signing.outputs.present == 'true'
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - if: steps.signing.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode keystore
        if: steps.signing.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Signed release APK
        if: steps.signing.outputs.present == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew --no-configuration-cache assembleRelease
          cd app/build/outputs/apk/release
          # A missing signing config yields app-release-unsigned.apk, which cannot be installed.
          [ -f app-release.apk ] || { echo "::error::서명된 APK(app-release.apk)가 만들어지지 않았습니다."; ls -l; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app-release.apk
          mv app-release.apk "monolauncher-$VERSION_NAME.apk"

      - name: Remove keystore
        if: always() && steps.signing.outputs.present == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: GitHub Release
        if: steps.signing.outputs.present == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            scripts/install.sh
            scripts/install.ps1
          fail_on_unmatched_files: true
          generate_release_notes: true
